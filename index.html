<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZindraERP - Smart Metal Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; color: #0f172a; margin: 0; padding: 0; }
      .animate-fade-in { animation: fadeIn 0.3s ease-out; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
      
      @media print {
        @page {
          size: A4 portrait;
          margin: 15mm;
        }
        
        html, body {
          background-color: white !important;
          height: auto !important;
          overflow: visible !important;
        }

        #root, .flex, main {
          display: block !important;
          margin: 0 !important;
          padding: 0 !important;
          width: 100% !important;
          height: auto !important;
          overflow: visible !important;
        }

        .print\:hidden,
        aside,
        nav,
        button,
        .no-print,
        select,
        input,
        .fixed,
        .sidebar-wrapper,
        #root > div > div:first-child {
          display: none !important;
        }

        main {
          margin-left: 0 !important;
          position: relative !important;
          padding: 0 !important;
          width: 100% !important;
        }

        .report-printable-area {
          display: block !important;
          width: 100% !important;
          border: none !important;
          box-shadow: none !important;
          padding: 0 !important;
          margin: 0 !important;
        }

        table {
          width: 100% !important;
          border-collapse: collapse !important;
          table-layout: auto !important;
        }

        th, td {
          border: 1px solid #dee2e6 !important;
          padding: 8px !important;
        }

        .bg-white { background-color: white !important; }
        .text-slate-900 { color: black !important; }
        .shadow-md, .shadow-xl, .shadow-sm { box-shadow: none !important; }
        .rounded-[2rem], .rounded-[2.5rem], .rounded-3xl, .rounded-xl { border-radius: 0 !important; }
        
        .print-bg-slate-50 { background-color: #f8fafc !important; -webkit-print-color-adjust: exact; }
        .print-text-black { color: black !important; }
        
        .break-inside-avoid {
          page-break-inside: avoid;
        }
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
